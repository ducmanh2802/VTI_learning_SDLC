name: Analytics

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "wp-*"

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics:
    name: Analytics lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "services/analytics/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check the formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict src

      - name: Check the layer rules
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov=analytics --cov-report=term --cov-report=xml

      - name: Check the generated models
        if: hashFiles('contracts/openapi/dist/internal.yaml') != ''
        run: |
          uv run datamodel-codegen \
            --input ../../contracts/openapi/dist/internal.yaml \
            --input-file-type openapi \
            --output src/analytics/api/models_generated.py \
            --output-model-type pydantic_v2.BaseModel \
            --target-python-version 3.12 \
            --snake-case-field \
            --allow-population-by-field-name \
            --use-annotated \
            --use-standard-collections \
            --use-union-operator \
            --use-double-quotes \
            --keep-model-order \
            --disable-timestamp \
            --formatters ruff-format ruff-check
          git diff --exit-code src/analytics/api/models_generated.py

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-coverage
          path: services/analytics/coverage.xml
