openapi: 3.1.0
info:
  title: VN Stock AI Pro - Public API
  version: 0.1.0
  description: |
    API công khai của Core service, phục vụ dưới `/api/v1`.
    Mọi lỗi 4xx/5xx dùng `application/problem+json` theo RFC 9457 với trường `code` ổn định.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Đăng ký, đăng nhập, hồ sơ và điều khoản.
  - name: consent
    description: Đồng ý xử lý dữ liệu cá nhân.
  - name: market
    description: Danh mục mã, giá, nến, chỉ báo và tổng quan thị trường.
  - name: ai
    description: Tóm tắt và hỏi đáp AI có dẫn nguồn.
  - name: watchlist
    description: Danh sách theo dõi.
  - name: alerting
    description: Cảnh báo giá và khối lượng.
  - name: notification
    description: Hộp thư và thiết bị nhận push.
  - name: paper
    description: Giao dịch giả lập.
  - name: support
    description: Phản hồi, trạng thái dịch vụ và sức khỏe hệ thống.
  - name: content
    description: Nội dung tĩnh do quản trị viên quản lý.
  - name: admin
    description: Chức năng quản trị, yêu cầu vai trò ADMIN.
  - name: telemetry
    description: Sự kiện sử dụng ẩn danh.
