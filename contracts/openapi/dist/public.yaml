                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/terms:
    post:
      operationId: adminPublishTerms
      summary: Phát hành phiên bản điều khoản
      description: Yêu cầu vai trò ADMIN. Phiên bản đã phát hành không sửa được.
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTermsRequest'
      responses:
        '201':
          description: Phiên bản đã phát hành.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/ai/reviews:
    get:
      operationId: adminListAiReviews
      summary: Danh sách nội dung AI cần rà soát
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - REJECTED
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách nội dung AI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/ai/reviews/{id}/verdict:
    post:
      operationId: adminSubmitAiReviewVerdict
      summary: Kết luận rà soát nội dung AI
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReviewVerdictRequest'
      responses:
        '200':
          description: Nội dung sau khi kết luận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/ops/ingestion:
    get:
      operationId: adminGetIngestionStatus
      summary: Trạng thái thu thập dữ liệu
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      responses:
        '200':
          description: Trạng thái các nguồn dữ liệu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/flags:
    get:
      operationId: adminListFlags
      summary: Danh sách cờ tính năng
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Các cờ tính năng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/flags/{key}:
    put:
      operationId: adminSetFlag
      summary: Bật hoặc tắt cờ tính năng
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      parameters:
        - $ref: '#/components/parameters/FlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlagRequest'
      responses:
        '200':
          description: Cờ sau khi cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/metrics:
    get:
      operationId: adminGetMetrics
      summary: Báo cáo chỉ số tháng
      description: Yêu cầu vai trò ADMIN.
      tags:
        - admin
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: Báo cáo chỉ số.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health:
    get:
      operationId: getHealth
      summary: Sức khỏe dịch vụ
      tags:
        - support
      security: []
      responses:
        '200':
          description: Trạng thái tổng hợp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - acceptedTerms
        - consents
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        inviteCode:
          type: string
          description: Bắt buộc khi cờ `beta_invite_only` đang bật.
          minLength: 4
          maxLength: 64
        acceptedTerms:
          type: array
          description: Phiên bản điều khoản và chính sách người dùng đã chấp thuận.
          minItems: 1
          items:
            type: string
        consents:
          type: object
          description: Lựa chọn ban đầu cho các mục đích tùy chọn; P1 luôn bắt buộc.
          required:
            - P2
            - P3
            - P4
          properties:
            P2:
              type: boolean
            P3:
              type: boolean
            P4:
              type: boolean
    UserProfile:
      type: object
      required:
        - id
        - email
        - status
        - role
        - plan
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
          maxLength: 60
        status:
          type: string
          enum:
            - PENDING_VERIFICATION
            - ACTIVE
            - SUSPENDED
            - DELETION_REQUESTED
            - DELETED
        role:
          type: string
          enum:
            - USER
            - ADMIN
        plan:
          type: string
          enum:
            - FREE
        emailVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: Lỗi RFC 9457 với mã lỗi ổn định của sản phẩm.
      required:
        - type
        - title
        - status
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
          description: URI mô tả loại lỗi.
        title:
          type: string
          description: Tiêu đề ngắn, hiển thị được cho người dùng.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Giải thích chi tiết, tiếng Việt.
        code:
          type: string
          description: Mã lỗi ổn định (SDD 3.6.1, cộng thêm INVITE_INVALID).
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - TOKEN_REUSED
            - TERMS_NOT_ACCEPTED
            - DERIVATIVE_RISK_NOT_ACKED
            - INVITE_INVALID
            - FORBIDDEN
            - NOT_FOUND
            - LIMIT_EXCEEDED
            - RISK_LOT_SIZE
            - RISK_PRICE_BAND
            - RISK_TICK_SIZE
            - RISK_INSUFFICIENT_CASH
            - RISK_INSUFFICIENT_SHARES
            - RISK_SESSION
            - RISK_ORDER_LIMIT
            - RISK_DAILY_LIMIT
            - RISK_HALTED
            - DATA_STALE
            - AI_QUOTA_EXCEEDED
            - RATE_LIMITED
            - ACCOUNT_LOCKED
            - INTERNAL_ERROR
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          description: Lỗi theo từng trường đầu vào.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
      example:
        type: https://api.example.vn/errors/risk-lot-size
        title: Khối lượng không hợp lệ
        status: 422
        detail: Khối lượng phải là bội số của 100 cổ phiếu.
        code: RISK_LOT_SIZE
        correlationId: c0a8012e-8f3a-4a1b-9c2d-5e6f7a8b9c0d
    VerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 16
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Thông điệp tiếng Việt, không tiết lộ dữ liệu cá nhân.
    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    LoginRequest:
      type: object
      required:
        - email
        - password
        - client
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        totp:
          type: string
          description: Mã TOTP 6 chữ số, bắt buộc với tài khoản quản trị.
          pattern: ^[0-9]{6}$
        client:
          type: string
          enum:
            - WEB
            - MOBILE
          description: WEB nhận refresh token qua cookie; MOBILE nhận trong body.
    TokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Thời hạn access token tính bằng giây.
          minimum: 1
        refreshToken:
          type:
            - string
            - 'null'
          description: Chỉ trả về cho client MOBILE; WEB dùng cookie `refresh_token`.
    RefreshRequest:
      type: object
      description: Client WEB có thể bỏ trống body và dùng cookie `refresh_token`; client MOBILE gửi token trong body.
      properties:
        refreshToken:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 16
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 10
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    DeleteAccountRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type:
            - string
            - 'null'
          maxLength: 60
    TermsStatus:
      type: object
      required:
        - currentVersions
        - acceptedVersions
        - pendingVersions
      properties:
        currentVersions:
          type: array
          items:
            type: object
            required:
              - version
              - kind
              - title
              - publishedAt
            properties:
              version:
                type: string
              kind:
                type: string
                enum:
                  - TERMS
                  - PRIVACY
                  - DERIVATIVE_RISK
              title:
                type: string
              publishedAt:
                type: string
                format: date-time
        acceptedVersions:
          type: array
          items:
            type: object
            required:
              - version
              - acceptedAt
            properties:
              version:
                type: string
              acceptedAt:
                type: string
                format: date-time
        pendingVersions:
          type: array
          description: Phiên bản hiện hành chưa được người dùng chấp thuận.
          items:
            type: string
    AcceptTermsRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          minLength: 1
    DerivativeRiskAckRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          minLength: 1
    Consent:
      type: object
      required:
        - purpose
        - description
        - required
        - granted
      properties:
        purpose:
          type: string
          enum:
            - P1
            - P2
            - P3
            - P4
        description:
          type: string
        required:
          type: boolean
        granted:
          type: boolean
        recordedAt:
          type: string
          format: date-time
    ConsentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
        nextCursor:
          type:
            - string
            - 'null'
    UpdateConsentRequest:
      type: object
      required:
        - granted
      properties:
        granted:
          type: boolean
    PersonalDataExport:
      type: object
      required:
        - exportedAt
        - profile
        - consents
        - watchlists
        - alerts
        - paperOrders
      properties:
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/UserProfile'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
        watchlists:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              symbols:
                type: array
                items:
                  type: string
        alerts:
          type: array
          items:
            type: object
            required:
              - id
              - symbol
              - conditionType
              - status
            properties:
              id:
                type: string
                format: uuid
              symbol:
                type: string
              conditionType:
                type: string
              status:
                type: string
        paperOrders:
          type: array
          items:
            type: object
            required:
              - id
              - symbol
              - side
              - orderType
              - quantity
              - status
            properties:
              id:
                type: string
                format: uuid
              symbol:
                type: string
              side:
                type: string
              orderType:
                type: string
              quantity:
                type: integer
              status:
                type: string
    Symbol:
      type: object
      required:
        - code
        - name
        - exchange
        - kind
        - lotSize
        - isActive
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9]{2,20}$
        name:
          type: string
        exchange:
          type: string
          enum:
            - HOSE
            - HNX
            - UPCOM
            - DERIV
        kind:
          type: string
          enum:
            - STOCK
            - FUTURE
            - INDEX
            - ETF
            - CW
        industryCode:
          type:
            - string
            - 'null'
        industryName:
          type:
            - string
            - 'null'
        lotSize:
          type: integer
          minimum: 1
        listedDate:
          type:
            - string
            - 'null'
          format: date
        expiryDate:
          type:
            - string
            - 'null'
          format: date
        isActive:
          type: boolean
    SymbolList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
        nextCursor:
          type:
            - string
            - 'null'
    SessionState:
      type: string
      description: Trạng thái phiên giao dịch (SRS FR-024).
      enum:
        - PRE_OPEN
        - ATO
        - CONTINUOUS
        - LUNCH_BREAK
        - ATC
        - POST_CLOSE
        - CLOSED
    Provenance:
      type: object
      required:
        - source
        - asOf
        - kind
        - stale
      properties:
        source:
          type: string
          description: Tên nguồn dữ liệu hoặc "Tính toán".
        asOf:
          type: string
          format: date-time
          description: Thời điểm dữ liệu được tạo, ISO 8601 kèm +07:00.
        kind:
          type: string
          enum:
            - DELAYED
            - CALCULATED
            - CLOSE
        stale:
          type: boolean
          description: true khi dữ liệu cũ hơn ngưỡng fail-closed; UI phải hiển thị nhãn.
    Quote:
      type: object
      required:
        - symbol
        - price
        - ref
        - ceiling
        - floor
        - volume
        - value
        - asOf
        - provider
        - session
        - provenance
      properties:
        symbol:
          type: string
          pattern: ^[A-Z0-9]{2,20}$
        price:
          type: number
          multipleOf: 0.01
        ref:
          type:
            - number
            - 'null'
          multipleOf: 0.01
          description: Giá tham chiếu.
        ceiling:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        floor:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        open:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        high:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        low:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        volume:
          type: integer
          format: int64
          minimum: 0
        value:
          type: integer
          format: int64
          minimum: 0
          description: Giá trị giao dịch tính bằng đồng.
        change:
          type:
            - number
            - 'null'
          multipleOf: 0.01
        pct:
          type:
            - number
            - 'null'
          description: Phần trăm thay đổi so với giá tham chiếu.
        asOf:
          type: string
          format: date-time
        provider:
          type: string
        session:
          $ref: '#/components/schemas/SessionState'
        provenance:
          $ref: '#/components/schemas/Provenance'
      example:
        symbol: FPT
        price: 125300
        ref: 124800
        ceiling: 133500
        floor: 116100
        open: 125000
        high: 126000
        low: 124500
        volume: 2450000
        value: 307000000000
        change: 500
        pct: 0.4
        asOf: '2026-10-20T10:15:30+07:00'
