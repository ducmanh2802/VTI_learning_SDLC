  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Không đủ quyền, chưa chấp thuận điều khoản, hoặc vai trò không phù hợp.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái hoặc vượt giới hạn gói.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Vượt giới hạn tần suất hoặc hạn mức sử dụng.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Tài khoản đang bị khóa tạm thời.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ hoặc dữ liệu thị trường không khả dụng (fail-closed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Số phần tử tối đa trên một trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Con trỏ trang kế tiếp do server trả về.
      schema:
        type: string
    Purpose:
      name: purpose
      in: path
      required: true
      description: Mã mục đích xử lý dữ liệu.
      schema:
        type: string
        enum:
          - P1
          - P2
          - P3
          - P4
    SymbolCode:
      name: code
      in: path
      required: true
      description: Mã chứng khoán viết hoa.
      schema:
        type: string
        pattern: ^[A-Z0-9]{2,20}$
    Id:
      name: id
      in: path
      required: true
      description: Định danh UUID của tài nguyên.
      schema:
        type: string
        format: uuid
    SymbolPath:
      name: symbol
      in: path
      required: true
      description: Mã chứng khoán viết hoa.
      schema:
        type: string
        pattern: ^[A-Z0-9]{2,20}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh, dùng để chống trùng khi thử lại.
      schema:
        type: string
        format: uuid
    FlagKey:
      name: key
      in: path
      required: true
      description: Khóa của cờ tính năng.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*$
