openapi: 3.1.0
info:
  title: VN Stock AI Pro - Public API
  version: 0.1.0
  description: |
    API công khai của Core service, phục vụ dưới `/api/v1`.
    Mọi lỗi 4xx/5xx dùng `application/problem+json` theo RFC 9457 với trường `code` ổn định.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: identity
    description: Đăng ký, đăng nhập, hồ sơ và điều khoản.
  - name: consent
    description: Đồng ý xử lý dữ liệu cá nhân.
  - name: market
    description: Danh mục mã, giá, nến, chỉ báo và tổng quan thị trường.
  - name: ai
    description: Tóm tắt và hỏi đáp AI có dẫn nguồn.
  - name: watchlist
    description: Danh sách theo dõi.
  - name: alerting
    description: Cảnh báo giá và khối lượng.
  - name: notification
    description: Hộp thư và thiết bị nhận push.
  - name: paper
    description: Giao dịch giả lập.
  - name: support
    description: Phản hồi, trạng thái dịch vụ và sức khỏe hệ thống.
  - name: content
    description: Nội dung tĩnh do quản trị viên quản lý.
  - name: admin
    description: Chức năng quản trị, yêu cầu vai trò ADMIN.
  - name: telemetry
    description: Sự kiện sử dụng ẩn danh.
paths:
  /auth/register:
    post:
      operationId: register
      summary: Đăng ký tài khoản
      description: Tạo tài khoản ở trạng thái PENDING_VERIFICATION, ghi nhận điều khoản và đồng ý ban đầu.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tài khoản đã được tạo; cần xác minh email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Xác minh email
      description: Dùng token một lần trong email xác minh để kích hoạt tài khoản.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email đã được xác minh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Gửi lại email xác minh
      description: Luôn trả 202 để không tiết lộ email có tồn tại hay không.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Yêu cầu đã được tiếp nhận.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập
      description: |
        Trả access token 15 phút và refresh token 30 ngày. Client WEB nhận refresh token
        trong cookie HttpOnly; client MOBILE nhận trong body. Tài khoản quản trị phải gửi TOTP.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          headers:
            Set-Cookie:
              description: Cookie `refresh_token` cho client WEB.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Xoay vòng refresh token
      description: |
        Chấp nhận cookie `refresh_token` hoặc body `{refreshToken}`. Dùng lại một refresh
        token đã xoay vòng sẽ thu hồi toàn bộ family và trả TOKEN_REUSED.
      tags:
        - identity
      security:
        - refreshCookie: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token mới.
          headers:
            Set-Cookie:
              description: Cookie refresh token mới cho client WEB.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token của phiên hiện tại và ngừng push cho thiết bị này.
      tags:
        - identity
      responses:
        '204':
          description: Đã đăng xuất.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Đăng xuất mọi phiên
      description: Thu hồi toàn bộ refresh token của người dùng.
      tags:
        - identity
      responses:
        '204':
          description: Đã thu hồi mọi phiên.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Yêu cầu đặt lại mật khẩu
      description: Luôn trả 202 để không tiết lộ email có tồn tại hay không.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Yêu cầu đã được tiếp nhận.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Đặt lại mật khẩu
      description: Dùng token một lần trong email; thu hồi mọi refresh token sau khi thành công.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Mật khẩu đã được đặt lại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/change:
    post:
      operationId: changePassword
      summary: Đổi mật khẩu
      description: Yêu cầu mật khẩu hiện tại đúng; các phiên khác bị thu hồi.
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Mật khẩu đã được đổi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      operationId: getMe
      summary: Lấy hồ sơ
      tags:
        - identity
      responses:
        '200':
          description: Hồ sơ người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      summary: Cập nhật hồ sơ
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteMe
      summary: Yêu cầu xóa tài khoản
      description: Chuyển tài khoản sang DELETION_REQUESTED và thu hồi mọi phiên.
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: Yêu cầu xóa đã được tiếp nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/terms:
    get:
      operationId: getMyTerms
      summary: Xem phiên bản điều khoản và trạng thái chấp thuận
      tags:
        - identity
      responses:
        '200':
          description: Phiên bản hiện hành và các phiên bản đã chấp thuận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/terms/accept:
    post:
      operationId: acceptTerms
      summary: Chấp thuận phiên bản điều khoản
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTermsRequest'
      responses:
        '200':
          description: Trạng thái điều khoản sau khi chấp thuận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/derivative-risk/ack:
    post:
      operationId: acknowledgeDerivativeRisk
      summary: Xác nhận công bố rủi ro phái sinh
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DerivativeRiskAckRequest'
      responses:
        '200':
          description: Đã ghi nhận xác nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/consents:
    get:
      operationId: listMyConsents
      summary: Danh sách đồng ý
      tags:
        - consent
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trạng thái đồng ý hiện tại của từng mục đích.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/consents/{purpose}:
    put:
      operationId: updateMyConsent
      summary: Thay đổi đồng ý cho một mục đích
      tags:
        - consent
      parameters:
        - $ref: '#/components/parameters/Purpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsentRequest'
      responses:
        '200':
          description: Trạng thái đồng ý sau khi thay đổi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/export:
    post:
      operationId: exportMyData
      summary: Xuất dữ liệu cá nhân
      tags:
        - identity
      responses:
        '200':
          description: Dữ liệu cá nhân dạng JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /symbols:
    get:
      operationId: listSymbols
      summary: Tìm mã chứng khoán
      tags:
        - market
      parameters:
        - name: q
          in: query
          required: false
          description: Chuỗi tìm kiếm theo mã hoặc tên không dấu.
          schema:
            type: string
            maxLength: 40
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            enum:
              - HOSE
              - HNX
              - UPCOM
              - DERIV
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách mã phù hợp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /symbols/{code}:
    get:
      operationId: getSymbol
      summary: Thông tin mã
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
      responses:
        '200':
          description: Thông tin mã.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Symbol'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /symbols/{code}/quote:
    get:
      operationId: getQuote
      summary: Giá mới nhất
      description: Trả giá mới nhất kèm provenance. Trả 503 DATA_STALE khi dữ liệu cũ hoặc thiếu.
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
      responses:
        '200':
          description: Giá mới nhất.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /symbols/{code}/orderbook:
    get:
      operationId: getOrderBook
      summary: Sổ lệnh ba bước giá
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
      responses:
        '200':
          description: Sổ lệnh hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /symbols/{code}/bars:
    get:
      operationId: getBars
      summary: Nến giá
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum:
              - D
              - W
              - M
            default: D
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách nến trong khoảng yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /symbols/{code}/indicators:
    get:
      operationId: getIndicators
      summary: Chỉ báo kỹ thuật
      description: Trả chỉ báo kèm câu mô tả quy tắc trung tính; chỉ báo thiếu dữ liệu có value = null.
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tập chỉ báo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /symbols/{code}/fundamentals:
    get:
      operationId: getFundamentals
      summary: Chỉ số cơ bản
      tags:
        - market
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
      responses:
        '200':
          description: Chỉ số cơ bản mới nhất.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fundamentals'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /symbols/{code}/ai-summary:
    get:
      operationId: getAiSummary
      summary: Tóm tắt AI cho một mã
      description: Chỉ mô tả dữ kiện hệ thống tính; không khuyến nghị mua/bán và không nêu giá mục tiêu.
      tags:
        - ai
      parameters:
        - $ref: '#/components/parameters/SymbolCode'
      responses:
        '200':
          description: Tóm tắt AI kèm dẫn nguồn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSummary'
              examples:
                published:
                  summary: Nội dung đã qua kiểm tra.
                  value:
                    interactionId: 6f1c2a44-6f0e-4f6a-9d7e-2b8c1d0e3f45
                    status: PUBLISHED
                    text: Giá đóng cửa 125.300 đồng [F1], tăng 1,21% [F2].
                    citations:
                      - id: F1
                        label: Giá đóng cửa
                        value: '125300'
                        unit: VND
                        source: KBS
                        asOf: '2026-10-20T15:00:00+07:00'
                    facts:
                      - id: F1
                        label: Giá đóng cửa
                        value: '125300'
                        unit: VND
                        source: KBS
                        asOf: '2026-10-20T15:00:00+07:00'
                    labels:
                      aiGenerated: true
                      notAdvice: true
                    provenance:
                      source: Tính toán
                      asOf: '2026-10-20T15:30:00+07:00'
                      kind: CALCULATED
                      stale: false
                fallback:
                  summary: Kiểm tra thất bại, trả bảng dữ kiện.
                  value:
                    interactionId: 8a2d3b55-7a1f-4b7b-8e8f-3c9d2e1f4a56
                    status: FALLBACK
                    text: null
                    citations: []
                    facts:
                      - id: F1
                        label: Giá đóng cửa
                        value: '125300'
                        unit: VND
                        source: KBS
                        asOf: '2026-10-20T15:00:00+07:00'
                    labels:
                      aiGenerated: true
                      notAdvice: true
                    provenance:
                      source: Tính toán
                      asOf: '2026-10-20T15:30:00+07:00'
                      kind: CALCULATED
                      stale: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market/overview:
    get:
      operationId: getMarketOverview
      summary: Tổng quan thị trường
      description: Trả chỉ số, độ rộng, top movers và thẻ nhận định; mục thiếu được liệt kê trong `unavailable`.
      tags:
        - market
      responses:
        '200':
          description: Tổng quan thị trường.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /market/treemap:
    get:
      operationId: getMarketTreemap
      summary: Bản đồ nhiệt
      tags:
        - market
      parameters:
        - name: weight
          in: query
          required: false
          schema:
            type: string
            enum:
              - VALUE
              - COUNT
              - ADVANCERS
            default: VALUE
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum:
              - ALL
              - UP
              - DOWN
            default: ALL
      responses:
        '200':
          description: Dữ liệu bản đồ nhiệt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Treemap'
        '400':
          $ref: '#/components/responses/BadRequest'
