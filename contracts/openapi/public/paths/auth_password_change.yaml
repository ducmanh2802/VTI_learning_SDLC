post:
  operationId: changePassword
  summary: Đổi mật khẩu
  description: Yêu cầu mật khẩu hiện tại đúng; các phiên khác bị thu hồi.
  tags: [identity]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/ChangePasswordRequest.yaml'
  responses:
    '200':
      description: Mật khẩu đã được đổi.
      content:
        application/json:
          schema:
            $ref: '../schemas/MessageResponse.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '429':
      $ref: '../responses/TooManyRequests.yaml'
