post:
  operationId: resendVerification
  summary: Gửi lại email xác minh
  description: Luôn trả 202 để không tiết lộ email có tồn tại hay không.
  tags: [identity]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/EmailRequest.yaml'
  responses:
    '202':
      description: Yêu cầu đã được tiếp nhận.
    '400':
      $ref: '../responses/BadRequest.yaml'
    '429':
      $ref: '../responses/TooManyRequests.yaml'
