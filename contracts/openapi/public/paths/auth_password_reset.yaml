post:
  operationId: resetPassword
  summary: Đặt lại mật khẩu
  description: Dùng token một lần trong email; thu hồi mọi refresh token sau khi thành công.
  tags: [identity]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/ResetPasswordRequest.yaml'
  responses:
    '200':
      description: Mật khẩu đã được đặt lại.
      content:
        application/json:
          schema:
            $ref: '../schemas/MessageResponse.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '429':
      $ref: '../responses/TooManyRequests.yaml'
