post:
  operationId: adminSubmitAiReviewVerdict
  summary: Kết luận rà soát nội dung AI
  description: Yêu cầu vai trò ADMIN.
  tags: [admin]
  parameters:
    - $ref: '../parameters/Id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/AiReviewVerdictRequest.yaml'
  responses:
    '200':
      description: Nội dung sau khi kết luận.
      content:
        application/json:
          schema:
            $ref: '../schemas/AiReview.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '403':
      $ref: '../responses/Forbidden.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
