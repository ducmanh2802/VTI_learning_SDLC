put:
  operationId: addWatchlistItem
  summary: Thêm mã vào danh sách theo dõi
  tags: [watchlist]
  parameters:
    - $ref: '../parameters/Id.yaml'
    - $ref: '../parameters/SymbolPath.yaml'
  responses:
    '201':
      description: Mã đã được thêm.
      content:
        application/json:
          schema:
            $ref: '../schemas/WatchlistItem.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
    '409':
      $ref: '../responses/Conflict.yaml'
delete:
  operationId: removeWatchlistItem
  summary: Xóa mã khỏi danh sách theo dõi
  tags: [watchlist]
  parameters:
    - $ref: '../parameters/Id.yaml'
    - $ref: '../parameters/SymbolPath.yaml'
  responses:
    '204':
      description: Đã xóa.
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
