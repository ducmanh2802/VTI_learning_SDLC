get:
  operationId: getBars
  summary: Nến giá
  tags: [market]
  parameters:
    - $ref: '../parameters/SymbolCode.yaml'
    - name: interval
      in: query
      required: false
      schema:
        type: string
        enum: [D, W, M]
        default: D
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    - $ref: '../parameters/Limit.yaml'
    - $ref: '../parameters/Cursor.yaml'
  responses:
    '200':
      description: Danh sách nến trong khoảng yêu cầu.
      content:
        application/json:
          schema:
            $ref: '../schemas/BarList.yaml'
    '400':
      $ref: '../responses/BadRequest.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '404':
      $ref: '../responses/NotFound.yaml'
