type: object
required: [id, email, status, role, plan, createdAt]
properties:
  id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  displayName:
    type: [string, 'null']
    maxLength: 60
  status:
    type: string
    enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DELETION_REQUESTED, DELETED]
  role:
    type: string
    enum: [USER, ADMIN]
  plan:
    type: string
    enum: [FREE]
  emailVerifiedAt:
    type: [string, 'null']
    format: date-time
  createdAt:
    type: string
    format: date-time
