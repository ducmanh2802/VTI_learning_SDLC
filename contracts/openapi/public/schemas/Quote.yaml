type: object
required: [symbol, price, ref, ceiling, floor, volume, value, asOf, provider, session, provenance]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  price:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
    description: Giá khớp gần nhất; null khi chưa có lệnh khớp trong phiên (không dùng 0).
  ref:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
    description: Giá tham chiếu.
  ceiling:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  floor:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  open:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  high:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  low:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  volume:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Khối lượng khớp lũy kế; null khi nguồn không cung cấp (ví dụ vnstock cấp Guest).
  value:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Giá trị giao dịch tính bằng đồng; null khi nguồn không cung cấp.
  change:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  pct:
    type: [number, 'null']
    description: Phần trăm thay đổi so với giá tham chiếu.
  asOf:
    type: string
    format: date-time
  provider:
    type: string
  session:
    $ref: './SessionState.yaml'
  provenance:
    $ref: './Provenance.yaml'
example:
  symbol: FPT
  price: 125300
  ref: 124800
  ceiling: 133500
  floor: 116100
  open: 125000
  high: 126000
  low: 124500
  volume: 2450000
  value: 307000000000
  change: 500
  pct: 0.4
  asOf: '2026-10-20T10:15:30+07:00'
  provider: KBS
  session: CONTINUOUS
  provenance:
    source: KBS
    asOf: '2026-10-20T10:15:30+07:00'
    kind: DELAYED
    stale: false
