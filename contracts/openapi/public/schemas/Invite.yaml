type: object
required: [id, maxUses, usedCount, expiresAt, createdAt]
properties:
  id:
    type: string
    format: uuid
  label:
    type: [string, 'null']
    maxLength: 80
  maxUses:
    type: integer
    minimum: 1
    maximum: 1000
  usedCount:
    type: integer
    minimum: 0
  expiresAt:
    type: string
    format: date-time
  revokedAt:
    type: [string, 'null']
    format: date-time
  createdAt:
    type: string
    format: date-time
