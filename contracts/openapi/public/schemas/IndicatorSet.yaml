type: object
required: [symbol, asOf, indicators, provenance]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  asOf:
    type: string
    format: date-time
  indicators:
    type: array
    items:
      type: object
      required: [code, name, rule, status]
      properties:
        code:
          type: string
          description: Ví dụ SMA20, EMA12, RSI14, MACD, BOLLINGER, ATR14, VOL_MA20.
        name:
          type: string
        value:
          type: [number, 'null']
          description: null khi chưa đủ dữ liệu; không thay bằng 0.
        display:
          type: [string, 'null']
        rule:
          type: string
          description: Câu mô tả trung tính, không chứa từ khuyến nghị.
        status:
          type: string
          enum: [OK, INSUFFICIENT_DATA]
  provenance:
    $ref: './Provenance.yaml'
