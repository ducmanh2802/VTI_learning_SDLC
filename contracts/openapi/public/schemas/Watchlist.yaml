type: object
required: [id, name, sortOrder, items, createdAt]
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
    maxLength: 50
  sortOrder:
    type: integer
  items:
    type: array
    items:
      $ref: './WatchlistItem.yaml'
  createdAt:
    type: string
    format: date-time
