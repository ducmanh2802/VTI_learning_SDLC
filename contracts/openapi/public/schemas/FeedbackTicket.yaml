type: object
required: [id, code, category, message, status, createdAt]
properties:
  id:
    type: string
    format: uuid
  code:
    type: string
    example: FB-2026-000123
  category:
    type: string
    enum: [FEEDBACK, COMPLAINT, BUG, DATA_ISSUE]
  message:
    type: string
  status:
    type: string
    enum: [OPEN, ANSWERED, CLOSED]
  createdAt:
    type: string
    format: date-time
  answeredAt:
    type: [string, 'null']
    format: date-time
