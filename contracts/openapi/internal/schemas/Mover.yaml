type: object
required: [symbol, price, pct, volume]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  price:
    type: number
    multipleOf: 0.01
  pct:
    type: number
  volume:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Khối lượng khớp trong phiên; null khi nguồn không cung cấp (ví dụ vnstock cấp Guest).
