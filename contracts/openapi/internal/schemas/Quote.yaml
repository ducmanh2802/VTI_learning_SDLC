type: object
required: [symbol, price, ref, ceiling, floor, volume, value, asOf, provider, session, provenance]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  price:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
    description: Giá khớp gần nhất; null khi chưa có lệnh khớp trong phiên (không dùng 0).
  ref:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  ceiling:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  floor:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  open:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  high:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  low:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  volume:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Khối lượng khớp lũy kế; null khi nguồn không cung cấp (ví dụ vnstock cấp Guest).
  value:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Giá trị giao dịch tính bằng đồng; null khi nguồn không cung cấp.
  change:
    type: [number, 'null']
    format: decimal
    multipleOf: 0.01
  pct:
    type: [number, 'null']
  asOf:
    type: string
    format: date-time
  provider:
    type: string
  session:
    $ref: './SessionState.yaml'
  provenance:
    $ref: './Provenance.yaml'
