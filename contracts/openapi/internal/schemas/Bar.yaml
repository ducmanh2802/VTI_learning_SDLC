type: object
required: [symbol, tradeDate, open, high, low, close, volume, value, provenance]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  tradeDate:
    type: string
    format: date
  open:
    type: number
    format: decimal
    multipleOf: 0.01
  high:
    type: number
    format: decimal
    multipleOf: 0.01
  low:
    type: number
    format: decimal
    multipleOf: 0.01
  close:
    type: number
    format: decimal
    multipleOf: 0.01
  volume:
    type: integer
    format: int64
    minimum: 0
  value:
    type: [integer, 'null']
    format: int64
    minimum: 0
    description: Giá trị giao dịch tính bằng đồng; null khi nguồn không cung cấp (market.daily_bars.value).
  provenance:
    $ref: './Provenance.yaml'
