type: object
required: [symbol, tradeDate, open, high, low, close, volume, value, provenance]
properties:
  symbol:
    type: string
    pattern: '^[A-Z0-9]{2,20}$'
  tradeDate:
    type: string
    format: date
  open:
    type: number
    multipleOf: 0.01
  high:
    type: number
    multipleOf: 0.01
  low:
    type: number
    multipleOf: 0.01
  close:
    type: number
    multipleOf: 0.01
  volume:
    type: integer
    format: int64
    minimum: 0
  value:
    type: integer
    format: int64
    minimum: 0
  provenance:
    $ref: './Provenance.yaml'
