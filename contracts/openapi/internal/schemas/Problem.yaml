type: object
description: Lỗi RFC 9457 với mã lỗi ổn định của sản phẩm.
required: [type, title, status, code, correlationId]
properties:
  type:
    type: string
    format: uri
  title:
    type: string
  status:
    type: integer
    minimum: 400
    maximum: 599
  detail:
    type: string
  code:
    type: string
    enum:
      - VALIDATION_ERROR
      - UNAUTHENTICATED
      - TOKEN_REUSED
      - TERMS_NOT_ACCEPTED
      - DERIVATIVE_RISK_NOT_ACKED
      - INVITE_INVALID
      - FORBIDDEN
      - NOT_FOUND
      - LIMIT_EXCEEDED
      - RISK_LOT_SIZE
      - RISK_PRICE_BAND
      - RISK_TICK_SIZE
      - RISK_INSUFFICIENT_CASH
      - RISK_INSUFFICIENT_SHARES
      - RISK_SESSION
      - RISK_ORDER_LIMIT
      - RISK_DAILY_LIMIT
      - RISK_HALTED
      - DATA_STALE
      - AI_QUOTA_EXCEEDED
      - RATE_LIMITED
      - ACCOUNT_LOCKED
      - INTERNAL_ERROR
  correlationId:
    type: string
    format: uuid
  errors:
    type: array
    items:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
