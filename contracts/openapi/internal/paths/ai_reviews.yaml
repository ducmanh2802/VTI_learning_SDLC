get:
  operationId: internalListAiReviews
  summary: Danh sách nội dung AI cần rà soát
  tags: [ai]
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, APPROVED, REJECTED]
    - $ref: '../parameters/Limit.yaml'
    - $ref: '../parameters/Cursor.yaml'
    - $ref: '../parameters/CorrelationId.yaml'
  responses:
    '200':
      description: Danh sách nội dung AI.
      content:
        application/json:
          schema:
            $ref: '../schemas/AiReviewList.yaml'
    '401':
      $ref: '../responses/Unauthorized.yaml'
    '429':
      $ref: '../responses/TooManyRequests.yaml'
