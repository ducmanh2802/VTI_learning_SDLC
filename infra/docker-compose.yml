# Dev only. Production overrides come in WP-22 (no host ports, internal network).

name: ${COMPOSE_PROJECT_NAME:-vnstockai}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 3g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD is required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=60
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy volatile-lru --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  migrator:
    image: flyway/flyway:11.13.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../db/migrations:/flyway/sql:ro
    networks:
      - internal

  analytics:
    build:
      context: ../services/analytics
    image: vnstockai/analytics:local
    profiles: ["app"]
    restart: unless-stopped
    mem_limit: 2500m
    command:
      - uvicorn
      - analytics.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --workers
      - "2"
    environment:
      ANALYTICS_DB_URL: postgresql+asyncpg://analytics_svc:${ANALYTICS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      LOG_LEVEL: ${ANALYTICS_LOG_LEVEL:-INFO}
      ENV: ${APP_ENV:-dev}
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  analytics-scheduler:
    build:
      context: ../services/analytics
    image: vnstockai/analytics:local
    profiles: ["app"]
    restart: unless-stopped
    mem_limit: 512m
    command: ["python", "-m", "analytics.ingestion.scheduler"]
    environment:
      ANALYTICS_DB_URL: postgresql+asyncpg://analytics_svc:${ANALYTICS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      LOG_LEVEL: ${ANALYTICS_LOG_LEVEL:-INFO}
      ENV: ${APP_ENV:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
